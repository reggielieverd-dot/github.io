<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            font-family: "Baskerville", serif;
            color: #f37020;
            text-align: center;
        }

        h1 {
            margin-top: 15vh;
            font-size: 48px;
        }

        .login-box {
            margin: 40px auto;
            width: 80%;
            max-width: 400px;
            background: white;              /* white box */
            padding: 30px;
            border-radius: 4px;
            border: 2px solid #f37020;      /* thin orange line */
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
            text-align: center;             /* center contents */
        }

        label {
            font-size: 18px;
            display: block;
            margin-bottom: 6px;
            text-align: left;
        }

        .field-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;            /* center input inside box */
            margin-bottom: 16px;
        }

        input {
            width: 90%;                     /* centered, not full edge-to-edge */
            padding: 10px;
            border: 1px solid #f37020;
            border-radius:4px;
            font-size: 16px;
        }

        button {
            width: 90%;
            padding: 12px;
            background-color: #f37020;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>

    <script>
        function login() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();

            if (user === "Dolphin") {
                window.location.href = "/Client-Dolphin.html";
            } else if (user === "Octopus") {
                window.location.href = "/Client-Octopus.html";
            } else if (user === "Orca") {
                window.location.href = "/Client-Orca.html";
            } else {
                alert("Invalid codename or password");
            }
        }
    </script>
</head>

<body>

    <h1>Client Portal</h1>

    <div class="login-box">
        <div class="field-wrapper">
            <label for="username">Codename</label>
            <input type="text" id="username" placeholder="Enter codename">
        </div>

        <div class="field-wrapper">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <button onclick="login()">Login</button>
    </div>

</body>
</html>
